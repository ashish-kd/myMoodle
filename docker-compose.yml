version: '3.8'

services:
  db:
    image: mariadb:11
    container_name: moodle_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodleuser
      MYSQL_PASSWORD: moodlepass
    volumes:
      - db_data:/var/lib/mysql
    

  web:
    image: php:8.2-apache
    container_name: moodle_web
    depends_on:
      - db
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ../moodledata:/var/moodledata
    environment:
      MOODLE_DB_HOST: db
      MOODLE_DB_NAME: moodle
      MOODLE_DB_USER: moodleuser
      MOODLE_DB_PASSWORD: moodlepass
    restart: always
    command: >
      bash -c "apt-get update && apt-get install -y \
      libzip-dev libpng-dev libicu-dev libxml2-dev libonig-dev libjpeg-dev zlib1g-dev \
      && docker-php-ext-install zip gd intl exif soap mysqli \
      && apache2-foreground"

volumes:
  db_data:


